#!/bin/bash
# Script: 05_taxonomy.sh

# Activar el entorno de conda con taxMyPhage y VIRIDIC
# conda activate taxonomy_tools

ASSEMBLY_DIR="assembly_results"
TAXONOMY_DIR="taxonomy_results"

echo "Creando directorio de taxonomía: $TAXONOMY_DIR"
mkdir -p $TAXONOMY_DIR

# Encontrar el archivo de contigs
CONTIGS=$(find $ASSEMBLY_DIR -name "*_assembly_contigs.fasta" | head -n 1)

if [ -z "$CONTIGS" ]; then
    echo "Error: No se encontró el archivo de contigs en $ASSEMBLY_DIR"
    exit 1
fi

BASE_NAME=$(basename $CONTIGS | sed 's/_assembly_contigs\.fasta//g')
echo "Clasificando taxonómicamente: $BASE_NAME"

# 1. Clasificación con taxMyPhage
echo "Ejecutando taxMyPhage..."
taxMyPhage -i $CONTIGS -o $TAXONOMY_DIR/taxMyPhage_${BASE_NAME} --threads 8

# 2. Similitud con VIRIDIC (requiere una base de datos de genomas de referencia)
# Descomentar si se tiene una base de datos de referencias de fagos T4 configurada
# VIRIDIC -i $CONTIGS -d /path/to/T4_reference_genomes/ -o $TAXONOMY_DIR/viridic_${BASE_NAME}

echo "Clasificación taxonómica completada."


