5. Validación de la Calidad del Ensamblaje

#!/bin/bash
# Script: 04_validate_assembly.sh

# Activar el entorno de conda con checkv y quast
# conda activate validation_tools

ASSEMBLY_DIR="assembly_results"
VALIDATION_DIR="validation_results"

echo "Creando directorio de validación: $VALIDATION_DIR"
mkdir -p $VALIDATION_DIR

# Encontrar el archivo de contigs
CONTIGS=$(find $ASSEMBLY_DIR -name "*_assembly_contigs.fasta" | head -n 1)

if [ -z "$CONTIGS" ]; then
    echo "Error: No se encontró el archivo de contigs en $ASSEMBLY_DIR"
    exit 1
fi

BASE_NAME=$(basename $CONTIGS | sed 's/_assembly_contigs\.fasta//g')
echo "Validando ensamblaje para: $BASE_NAME"

# 1. Validación con CheckV
echo "Ejecutando CheckV para evaluar integridad viral..."
checkv end_to_end $CONTIGS $VALIDATION_DIR/checkv_${BASE_NAME} -t 8

# 2. Evaluación con QUAST
echo "Ejecutando QUAST para métricas de calidad..."
quast.py $CONTIGS \
         -o $VALIDATION_DIR/quast_${BASE_NAME} \
         --min-contig 200 \
         --gene-finding \
         -t 8

echo "Validación completada. Revisar los reportes en $VALIDATION_DIR"

